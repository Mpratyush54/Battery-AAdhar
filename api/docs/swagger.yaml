definitions:
  controllers.QrValidationRequest:
    properties:
      payload_json:
        type: string
    type: object
  models.BatteryDescriptorRequest:
    properties:
      capacity_kwh:
        type: number
      cell_count:
        type: integer
      cell_type:
        type: string
      cell_voltage_nominal_v:
        type: number
      chemistry_type:
        type: string
      declared_cycle_life:
        type: integer
      manufacture_date:
        type: string
      manufacturer_id:
        type: string
      manufacturing_country:
        type: string
      manufacturing_facility:
        type: string
      nominal_current_a:
        type: number
      nominal_voltage_v:
        type: number
      warranty_years:
        type: integer
    type: object
  models.BatteryRegistrationRequest:
    properties:
      carbon:
        $ref: '#/definitions/models.CarbonFootprintRequest'
      descriptor:
        $ref: '#/definitions/models.BatteryDescriptorRequest'
      health:
        $ref: '#/definitions/models.HealthUpdateRequest'
      material:
        $ref: '#/definitions/models.MaterialCompositionRequest'
    type: object
  models.CarbonComparison:
    properties:
      bpan_a:
        type: string
      bpan_a_lower:
        type: boolean
      bpan_b:
        type: string
      emissions_per_kwh_delta:
        type: number
      stage1_delta:
        type: number
      stage2_delta:
        type: number
      stage3_delta:
        type: number
      stage4_delta:
        type: number
      stage5_delta:
        type: number
      total_delta:
        type: number
    type: object
  models.CarbonFootprintRequest:
    properties:
      cell_production_method:
        type: string
      factory_energy_source:
        type: string
      manufacturing_emissions_kg_co2e:
        type: number
      manufacturing_location:
        type: string
      mining_method:
        type: string
      raw_material_emissions_kg_co2e:
        type: number
      raw_material_source_country:
        type: string
      recycling_avoided_mining:
        type: number
      recycling_emissions_kg_co2e:
        type: number
      recycling_method:
        type: string
      recycling_recovery_rate:
        type: number
      transport_distance_km:
        type: number
      transport_emissions_kg_co2e:
        type: number
      transport_mode:
        type: string
      transport_packaging:
        type: string
      usage_annual_km:
        type: integer
      usage_emissions_kg_co2e:
        type: number
      usage_grid_emissions_factor_gco2e_per_kwh:
        type: number
      usage_years:
        type: integer
    type: object
  models.CarbonFootprintResponse:
    properties:
      bpan:
        type: string
      emissions_per_kwh:
        type: number
      total_emissions_kg_co2e:
        type: number
      verification_standard:
        type: string
      verified:
        type: boolean
      verified_at:
        type: string
      verified_by:
        type: string
    type: object
  models.ComplianceDashboard:
    properties:
      batteries_with_violations:
        type: integer
      compliance_rate_percent:
        type: number
      critical_violations:
        type: integer
      last_scan_at:
        type: string
      total_batteries:
        type: integer
      violations_by_manufacturer:
        additionalProperties:
          format: int32
          type: integer
        type: object
      violations_by_type:
        additionalProperties:
          format: int32
          type: integer
        type: object
      warning_violations:
        type: integer
    type: object
  models.ComplianceProofResponse:
    properties:
      bpan:
        type: string
      commitment:
        items:
          type: integer
        type: array
      note:
        type: string
      proof:
        items:
          type: integer
        type: array
      requirement:
        description: '"operational", "second_life", "recyclable"'
        type: string
      statement:
        description: Human-readable claim
        type: string
    type: object
  models.ComplianceStatusResponse:
    properties:
      bpan:
        type: string
      critical_count:
        type: integer
      last_checked_at:
        type: string
      status:
        description: '"COMPLIANT", "WARNINGS_EXIST", "VIOLATIONS_EXIST"'
        type: string
      violations:
        items:
          $ref: '#/definitions/models.ComplianceViolation'
        type: array
      warning_count:
        type: integer
    type: object
  models.ComplianceViolation:
    properties:
      action_deadline:
        type: string
      description:
        type: string
      detected_at:
        type: string
      requires_action:
        type: boolean
      severity:
        description: '"INFO", "WARNING", "CRITICAL"'
        type: string
      violation_type:
        type: string
    type: object
  models.HealthDashboard:
    properties:
      avg_soh_by_chemistry:
        additionalProperties:
          format: float32
          type: number
        type: object
      avg_soh_by_manufacturer:
        additionalProperties:
          format: float32
          type: number
        type: object
      eol_count:
        type: integer
      operational_count:
        type: integer
      second_life_count:
        type: integer
      waste_count:
        type: integer
    type: object
  models.HealthRecord:
    properties:
      average_temperature_celsius:
        type: number
      bpan:
        type: string
      cycle_count:
        type: integer
      health_status:
        description: OPERATIONAL, SECOND_LIFE, etc.
        type: string
      proofs_generated:
        type: boolean
      reported_at:
        type: string
      state_of_health_percent:
        type: number
    type: object
  models.HealthUpdateRequest:
    properties:
      average_temperature_celsius:
        type: number
      cell_voltage_max_mv:
        type: number
      cell_voltage_min_mv:
        type: number
      cycle_count:
        type: integer
      degradation_class:
        type: string
      error_flags:
        type: string
      internal_resistance_mohm:
        type: number
      max_temperature_celsius:
        type: number
      min_temperature_celsius:
        type: number
      state_of_health_percent:
        type: number
    type: object
  models.LoginPayload:
    properties:
      email:
        example: admin@example.com
        type: string
      password:
        example: MySecureP@ssw0rd!
        type: string
    type: object
  models.LoginResponseJSON:
    properties:
      message:
        example: Logged in successfully
        type: string
      role:
        example: Government Authority
        type: string
      stakeholderId:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    type: object
  models.MaterialCompositionRequest:
    properties:
      anode_material:
        example: Graphite
        type: string
      cadmium_content_g:
        example: 0
        type: number
      cathode_material:
        description: Public fields
        example: NMC811
        type: string
      cobalt_content_g:
        example: 120
        type: number
      electrolyte_type:
        example: LiPF6
        type: string
      hazardous_substances:
        example: LiPF6
        type: string
      lead_content_g:
        example: 0
        type: number
      lithium_content_g:
        description: Private fields (encrypted at Rust layer)
        example: 450
        type: number
      manganese_content_g:
        example: 85
        type: number
      nickel_content_g:
        example: 310
        type: number
      recyclable_percentage:
        example: 92.5
        type: number
      separator_material:
        example: PE/PP
        type: string
      supply_chain_source:
        example: Korea/Posco
        type: string
    type: object
  models.MaterialCompositionResponse:
    properties:
      anode_material:
        type: string
      bpan:
        type: string
      cadmium_content_g:
        type: number
      cathode_material:
        type: string
      cobalt_content_g:
        type: number
      electrolyte_type:
        type: string
      hazardous_substances:
        type: string
      lead_content_g:
        type: number
      lithium_content_g:
        description: Private fields — populated only for authorised roles
        type: number
      manganese_content_g:
        type: number
      nickel_content_g:
        type: number
      partial:
        description: true if private fields were redacted
        type: boolean
      recyclable_percentage:
        type: number
      separator_material:
        type: string
      supply_chain_source:
        type: string
    type: object
  models.RecoveryRates:
    properties:
      cobalt_percent:
        type: number
      lithium_percent:
        type: number
      nickel_percent:
        type: number
      other_percent:
        type: number
    type: object
  models.RecyclingRecordRequest:
    properties:
      method:
        description: '"hydrometallurgical", "pyrometallurgical", "mechanical"'
        type: string
      recovery_rates:
        $ref: '#/definitions/models.RecoveryRates'
      standard:
        description: '"ISO 14040", "R2C2", etc.'
        type: string
      weight_kg:
        type: number
    type: object
  models.RefreshResponseJSON:
    properties:
      message:
        example: Token refreshed successfully
        type: string
    type: object
  models.RegisterStakeholderPayload:
    properties:
      aadharDocumentBase64:
        example: data:image/png;base64,iVBORw0KGgo...
        type: string
      aadharNumber:
        example: "123456789012"
        type: string
      email:
        example: admin@example.com
        type: string
      password:
        example: MySecureP@ssw0rd!
        type: string
      profileDetails:
        example: '{}'
        type: string
      role:
        example: Government Authority
        type: string
    type: object
  models.RegisterStakeholderResponseJSON:
    properties:
      stakeholderId:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      status:
        example: SUCCESS
        type: string
    type: object
  models.ReuseCertificationRequest:
    properties:
      application:
        description: '"stationary_storage", "grid_backup", "renewable_integration"'
        type: string
      expected_years:
        type: integer
      soh_percent:
        type: number
    type: object
  models.SubmitMaterialResponse:
    properties:
      data_hash:
        type: string
      event_hash:
        type: string
      success:
        type: boolean
    type: object
  models.TransferInitiateRequest:
    properties:
      reason:
        type: string
      to_owner_id:
        type: string
      to_owner_role:
        type: string
    type: object
  models.TransferRejectRequest:
    properties:
      reason:
        type: string
    type: object
  models.TransitionStateRequest:
    properties:
      details:
        type: string
      new_state:
        type: string
    type: object
  models.VerificationRequest:
    properties:
      standard:
        description: ISO 14040, PEF, EU ETS
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/batteries/{bpan_a}/carbon/compare/{bpan_b}:
    get:
      consumes:
      - application/json
      description: Emission delta per stage, identify lower-emission battery
      parameters:
      - description: First BPAN
        in: path
        name: bpan_a
        required: true
        type: string
      - description: Second BPAN
        in: path
        name: bpan_b
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Comparison result
          schema:
            $ref: '#/definitions/models.CarbonComparison'
      summary: Compare carbon footprints (A vs B)
      tags:
      - carbon
  /api/v1/batteries/{bpan}:
    get:
      consumes:
      - application/json
      description: Decodes BPAN and returns human-readable details (public endpoint)
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Full battery details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid BPAN
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get battery by BPAN path parameter
      tags:
      - battery
  /api/v1/batteries/{bpan}/carbon:
    get:
      consumes:
      - application/json
      description: Retrieve BCF (all roles can view verified data)
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Carbon footprint
          schema:
            $ref: '#/definitions/models.CarbonFootprintResponse'
      summary: Get battery carbon footprint
      tags:
      - carbon
    post:
      consumes:
      - application/json
      description: Submit BCF with raw material, manufacturing, transport, usage,
        recycling emissions
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      - description: Carbon data (5 stages)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CarbonFootprintRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Submission ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Unauthorized (non-manufacturer)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Submit battery carbon footprint (5-stage emissions)
      tags:
      - carbon
  /api/v1/batteries/{bpan}/carbon/verify:
    post:
      consumes:
      - application/json
      description: Mark carbon data as verified against standard (ISO 14040, PEF,
        EU ETS)
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      - description: Verification details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.VerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Verified
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Unauthorized (non-verifier)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Verify carbon footprint (third-party verifier only)
      tags:
      - carbon
  /api/v1/batteries/{bpan}/compliance:
    get:
      consumes:
      - application/json
      description: Returns compliance status and violations for a battery
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ComplianceStatusResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get battery compliance status
      tags:
      - compliance
  /api/v1/batteries/{bpan}/health:
    get:
      consumes:
      - application/json
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthRecord'
      summary: Get current battery health status
      tags:
      - health
    patch:
      consumes:
      - application/json
      description: Submit health update from BMS or manufacturer
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      - description: Health data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.HealthUpdateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Record ID
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Rate limited
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update battery health (SoH, cycles, degradation)
      tags:
      - health
  /api/v1/batteries/{bpan}/health/history:
    get:
      consumes:
      - application/json
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      - description: Max records (default 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.HealthRecord'
            type: array
      summary: Get battery health time-series
      tags:
      - health
  /api/v1/batteries/{bpan}/status:
    patch:
      consumes:
      - application/json
      description: Update battery lifecycle status (service provider only)
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Update battery status
      tags:
      - battery
  /api/v1/batteries/{bpan}/verify/operational:
    post:
      description: Generates a ZK proof that battery meets operational standards (government/regulator
        only)
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ComplianceProofResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Verify battery operational compliance (ZK proof)
      tags:
      - compliance
  /api/v1/batteries/{bpan}/verify/second-life:
    post:
      description: Generates a ZK proof that battery is eligible for second-life use
        (government/regulator only)
      parameters:
      - description: BPAN
        in: path
        name: bpan
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ComplianceProofResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Verify second-life eligibility (ZK proof)
      tags:
      - compliance
  /api/v1/batteries/register:
    post:
      consumes:
      - application/json
      description: 'Atomic registration: descriptor + BMCS + BCF + initial health'
      parameters:
      - description: Complete battery data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.BatteryRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: BPAN generated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid data
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Register new battery with all static data
      tags:
      - battery
  /api/v1/battery:
    get:
      consumes:
      - application/json
      description: Returns public battery data by decoding the BPAN (no DB lookup
        needed)
      parameters:
      - description: BPAN
        in: query
        name: bpan
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Battery details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid or missing BPAN
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get battery by query parameter
      tags:
      - battery
  /api/v1/battery/register:
    post:
      consumes:
      - application/json
      description: Legacy registration endpoint — use POST /api/v1/batteries/register
        for atomic registration
      produces:
      - application/json
      responses:
        "501":
          description: Not implemented — use /api/v1/batteries/register
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Register battery (legacy endpoint)
      tags:
      - battery
  /api/v1/circular-economy/batteries/{bpan}/recycle:
    post:
      consumes:
      - application/json
      description: Transitions state to RECYCLED (recycler only)
      parameters:
      - description: Battery PAN
        in: path
        name: bpan
        required: true
        type: string
      - description: Recycling record payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RecyclingRecordRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Record battery recycling
      tags:
      - circular-economy
  /api/v1/circular-economy/batteries/{bpan}/reuse:
    post:
      consumes:
      - application/json
      description: Transitions state to SECOND_LIFE (reuse operator only)
      parameters:
      - description: Battery PAN
        in: path
        name: bpan
        required: true
        type: string
      - description: Reuse certification payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ReuseCertificationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Certify battery for second-life reuse
      tags:
      - circular-economy
  /api/v1/circular-economy/dashboard:
    get:
      description: Returns aggregated reuse and recycling metrics
      parameters:
      - description: Filter by manufacturer
        in: query
        name: manufacturer_id
        type: string
      - description: Filter by chemistry
        in: query
        name: chemistry_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            type: string
      summary: Get circular economy metrics dashboard
      tags:
      - circular-economy
  /api/v1/compliance/scan:
    post:
      consumes:
      - application/json
      description: Scans all batteries for compliance violations (regulator only)
      produces:
      - application/json
      responses:
        "202":
          description: Scan completed
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden (non-regulator)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Trigger compliance scan for all batteries
      tags:
      - compliance
  /api/v1/dashboard/compliance:
    get:
      description: Returns aggregated compliance statistics (regulator/admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ComplianceDashboard'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get compliance dashboard
      tags:
      - compliance
  /api/v1/health/dashboard:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthDashboard'
      summary: Get battery health dashboard metrics
      tags:
      - health
  /api/v1/manufacturers:
    get:
      description: List all registered manufacturers (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
