syntax = "proto3";

package bpa.lifecycle.v1;

option go_package = "github.com/Mpratyush54/Battery-AAdhar/api/gen/proto/lifecycle/v1;lifecyclev1";

import "google/protobuf/timestamp.proto";

message VerifyOperationalRequest {
  string bpan         = 1;
  string requester_id = 2;
}

message VerifyOperationalResponse {
  bool   is_operational = 1;
  bytes  zk_proof       = 2; // bulletproof bytes — verifiable offline
  bytes  public_inputs  = 3;
  google.protobuf.Timestamp proof_issued_at = 4;
  int64  proof_valid_until_unix = 5;
}

message VerifyRecyclableRequest {
  string bpan                      = 1;
  float  min_recyclability_percent = 2;
}

message VerifyRecyclableResponse {
  bool   meets_threshold = 1;
  bytes  zk_proof        = 2;
  bytes  public_inputs   = 3;
}

message VerifySignatureRequest {
  string bpan = 1;
}

message VerifySignatureResponse {
  bool   tamper_evident     = 1;
  string signer_key_id      = 2;
  google.protobuf.Timestamp signed_at = 3;
}

message TransitionStateRequest {
  string bpan       = 1;
  string new_state  = 2; // REGISTERED, OPERATIONAL, etc.
  string actor_id   = 3;
  string actor_role = 4;
  string details    = 5;
}

message TransitionStateResponse {
  bool   success    = 1;
  string event_id   = 2;
  string entry_hash = 3;
}

message InitiateTransferRequest {
  string bpan            = 1;
  string from_owner_id   = 2;
  string to_owner_id     = 3;
  string from_owner_role = 4;
  string to_owner_role   = 5;
  string reason          = 6;
}

message InitiateTransferResponse {
  string transfer_id = 1;
}

message ConfirmTransferRequest {
  string transfer_id         = 1;
  string confirming_owner_id = 2;
}

message ConfirmTransferResponse {
  bool is_complete = 1;
}

message RejectTransferRequest {
  string transfer_id         = 1;
  string rejecting_owner_id  = 2;
  string reason              = 3;
}

message RejectTransferResponse {
  bool success = 1;
}

service LifecycleService {
  rpc VerifyOperational (VerifyOperationalRequest) returns (VerifyOperationalResponse);
  rpc VerifyRecyclable  (VerifyRecyclableRequest)  returns (VerifyRecyclableResponse);
  rpc VerifySignature   (VerifySignatureRequest)   returns (VerifySignatureResponse);

  // New methods for Day 12
  rpc TransitionState  (TransitionStateRequest)  returns (TransitionStateResponse);
  rpc InitiateTransfer (InitiateTransferRequest) returns (InitiateTransferResponse);
  rpc ConfirmTransfer  (ConfirmTransferRequest)  returns (ConfirmTransferResponse);
  rpc RejectTransfer   (RejectTransferRequest)   returns (RejectTransferResponse);
}
